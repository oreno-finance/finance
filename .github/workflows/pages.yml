name: Deploy Finance to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Every Monday 09:17 JST (00:17 UTC); scan only, do not deploy.
    - cron: '17 0 * * 1'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed on 2026-11-22
        with:
          fetch-depth: 0
          persist-credentials: false
          # PR uses GitHub's synthetic merge ref, exercising the merged tree.
          # The scanner narrowly excludes only that synthetic commit's identity.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies from locked versions
        run: npm ci
      - name: Inspect author, tracked files, PII, CSP and secrets
        env:
          FINANCE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FINANCE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/audit-publication.mjs --tree
      - name: Audit every incoming commit for historical personal information
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          FINANCE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FINANCE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FINANCE_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/audit-publication.mjs --range "$FINANCE_PR_BASE_SHA" "$FINANCE_PR_HEAD_SHA"
          else
            node scripts/audit-publication.mjs --range "$FINANCE_PUSH_BEFORE_SHA" "$GITHUB_SHA"
          fi
      - name: Gitleaks full history secret scan
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --no-banner --log-opts="--all" .
      - name: Audit dependencies for high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Typecheck, build and exercise the tests before merging
        env:
          FINANCE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FINANCE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run check
          npm test
          npm run verify:cloud
          npm run audit:tree
      - name: Gitleaks scan of actual published build
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir --redact --no-banner dist
      - name: Upload exactly the audited Pages build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist

  deploy:
    needs: security
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # No checkout, npm install or rebuild here: publish the audited artifact.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
