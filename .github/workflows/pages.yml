name: Deploy Finance to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Every Monday 09:17 JST (00:17 UTC); scan only, do not deploy.
    - cron: '17 0 * * 1'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # Avoid the synthetic GitHub merge author on pull_request events.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies from locked versions
        run: npm ci
      - name: Inspect author, tracked files, PII, CSP and secrets
        run: node scripts/audit-publication.mjs --tree
      - name: Gitleaks full history secret scan
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --no-banner --log-opts="--all" .
      - name: Audit dependencies for high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Typecheck, build and exercise the tests before merging
        run: |
          npm run check
          npm test
          npm run verify:cloud
          npm run audit:tree

  deploy:
    needs: security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build Finance
        run: |
          npm run check
          npm run test
          npm run verify:cloud

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
