<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Finance E2E テスト専用（架空データ）</title><link rel="stylesheet" href="/dist/styles/app.css"><style>body{margin:0;padding:12px;font-family:system-ui,sans-serif}.e2e-panel{max-width:1200px;margin:auto}#future-results{max-width:1100px}input{max-width:250px}#e2e-spacer{height:1200px}</style></head>
<body><div class="e2e-panel">
<section id="e2e-future">
  <input id="future-target" type="month"><input id="future-age" type="range" min="16" max="70" value="40">
  <input id="future-change-month" type="month"><input id="future-saving-amount" type="number">
  <input id="future-scenario-nisa" type="number"><input id="future-nisa-rate" type="range" min="0" max="20" step="0.1" value="3">
  <details id="future-scenario-accordion"><summary>積立変更</summary><div id="future-scenario-settings"><div id="future-cash-amount-wrap"></div><div id="future-nisa-amount-wrap"></div><input id="future-compare-cash" type="checkbox" checked><input id="future-compare-nisa" type="checkbox"></div></details>
  <span id="future-age-value"></span><span id="future-nisa-rate-value"></span><span id="future-target-label"></span>
  <button id="future-birth-settings">生年月の設定</button><span id="future-scenario-hint"></span><div id="future-hint"></div><div id="future-results"></div>
</section>
<section id="e2e-summary" hidden>
  <div id="monthly-period-controls" class="finance-period-nav"><button id="monthly-prev" type="button">前月</button><button id="monthly-next" type="button">翌月</button><button id="monthly-today" type="button">今月</button>
  <input id="monthly-period" type="month"></div><span id="monthly-heading-period"></span><div id="monthly-content"></div>
</section>
<section id="e2e-reports" hidden><div id="reports-content"></div></section>
<div id="e2e-spacer"></div></div></body></html>
